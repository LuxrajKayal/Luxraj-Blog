<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 260 220"
  width="260"
  height="220"
  role="img"
  aria-labelledby="luxy-title luxy-description"
>
  <title id="luxy-title">Luxy — static mascot</title>
  <desc id="luxy-description">A cream-coloured, rounded character wearing a blue postman cap and holding a magnifying glass.</desc>

  <!-- Static floor shadow -->
  <ellipse cx="130" cy="202" rx="68" ry="11" fill="rgba(45, 35, 46, 0.12)" />

  <!-- Luxy's body and ears -->
  <g>
    <circle cx="66" cy="96" r="16" fill="#FFE5F1" stroke="#2D232E" stroke-width="4.5" />
    <circle cx="194" cy="96" r="16" fill="#FFE5F1" stroke="#2D232E" stroke-width="4.5" />

    <path
      d="M 55 148 C 50 92, 82 55, 130 55 C 178 55, 210 92, 205 148 C 202 184, 182 196, 130 196 C 78 196, 58 184, 55 148 Z"
      fill="#FFFDF9"
      stroke="#2D232E"
      stroke-width="5"
      stroke-linejoin="round"
    />

    <!-- Soft lower-body shading -->
    <path
      d="M 65 168 C 78 190, 182 190, 195 168 C 190 188, 172 193, 130 193 C 88 193, 70 188, 65 168 Z"
      fill="#F7F1E5"
    />

    <!-- Postman cap and LUXY badge -->
    <g transform="translate(0, -3)">
      <path d="M 88 64 C 88 36, 172 36, 172 64 Z" fill="#38BDF8" stroke="#2D232E" stroke-width="4.5" stroke-linejoin="round" />
      <path d="M 80 63 Q 130 74 180 63 Q 186 56 172 58 L 88 58 Q 74 56 80 63 Z" fill="#2D232E" />
      <rect x="108" y="41" width="44" height="15" rx="7.5" fill="#FFD166" stroke="#2D232E" stroke-width="2.5" />
      <text x="130" y="51.5" text-anchor="middle" font-size="12px" font-weight="700" fill="#2D232E">LUXY</text>
    </g>

    <!-- Cheeks -->
    <ellipse cx="82" cy="128" rx="12" ry="7" fill="#FF7EB6" opacity="0.65" />
    <ellipse cx="178" cy="128" rx="12" ry="7" fill="#FF7EB6" opacity="0.65" />

    <!-- Default eyes with their normal highlights -->
    <g>
      <g transform="translate(98, 112)">
        <circle cx="0" cy="0" r="13.5" fill="#2D232E" />
        <circle cx="-4.5" cy="-4.5" r="4.8" fill="#FFFFFF" />
        <circle cx="4.5" cy="4.5" r="2.2" fill="#FFFFFF" />
      </g>
      <g transform="translate(162, 112)">
        <circle cx="0" cy="0" r="13.5" fill="#2D232E" />
        <circle cx="-4.5" cy="-4.5" r="4.8" fill="#FFFFFF" />
        <circle cx="4.5" cy="4.5" r="2.2" fill="#FFFFFF" />
      </g>
    </g>

    <!-- Default smile -->
    <path
      d="M 118 124 Q 124 132 130 124 Q 136 132 142 124"
      fill="none"
      stroke="#2D232E"
      stroke-width="4"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Static magnifying glass; the right paw overlaps the handle tip -->
    <g>
      <path d="M 140 168 L 160 160" fill="none" stroke="#2D232E" stroke-width="9" stroke-linecap="round" />
      <path d="M 140 168 L 160 160" fill="none" stroke="#38BDF8" stroke-width="4.5" stroke-linecap="round" />
      <circle cx="126" cy="155" r="17" fill="#DDF5FF" stroke="#2D232E" stroke-width="4.5" />
      <path d="M 116 148 Q 120 142 127 141" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
    </g>

    <!-- Hands -->
    <circle cx="94" cy="162" r="11" fill="#FFFDF9" stroke="#2D232E" stroke-width="4" />
    <circle cx="166" cy="162" r="11" fill="#FFFDF9" stroke="#2D232E" stroke-width="4" />
  </g>
</svg>
