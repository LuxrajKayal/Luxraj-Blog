<desc
   id="luxy-description">A cream-coloured, rounded character wearing a blue postman cap and holding a magnifying glass.</desc>
<!-- Static floor shadow -->
<ellipse
   cx="130"
   cy="202"
   rx="68"
   ry="11"
   fill="rgba(45, 35, 46, 0.12)"
   id="ellipse1" />
