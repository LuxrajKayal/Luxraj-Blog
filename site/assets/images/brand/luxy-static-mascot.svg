  <title id="luxy-title">Luxy - static mascot</title>
<desc id="luxy-description">A cream-coloured, rounded character wearing a blue postman cap and holding a magnifying glass.</desc>
<!-- Static floor shadow -->
<ellipse cx="130" cy="202" rx="68" ry="11" fill="rgba(45, 35, 46, 0.12)" id="ellipse1" />
<!-- Luxy's body and ears -->
<g id="g15">
  <circle cx="66" cy="96" r="16" fill="#FFE5F1" stroke="#2D232E" stroke-width="4.5" id="circle1" />
  <circle cx="194" cy="96" r="16" fill="#FFE5F1" stroke="#2D232E" stroke-width="4.5" id="circle2" />
  <path d="M 55 148 C 50 92, 82 55, 130 55 C 178 55, 210 92, 205 148 C 202 184, 182 196, 130 196 C 78 196, 58 184, 55 148 Z" fill="#FFFDF9" stroke="#2D232E" stroke-width="5" stroke-linejoin="round" id="path2" />
  <!-- Soft lower-body shading -->
  <path d="M 65 168 C 78 190, 182 190, 195 168 C 190 188, 172 193, 130 193 C 88 193, 70 188, 65 168 Z" fill="#F7F1E5" id="path3" />
  <!-- Postman cap and LUXY badge -->
  <g transform="translate(0, -3)" id="g5">
    <path d="M 88 64 C 88 36, 172 36, 172 64 Z" fill="#38BDF8" stroke="#2D232E" stroke-width="4.5" stroke-linejoin="round" id="path4" />
    <path d="M 80 63 Q 130 74 180 63 Q 186 56 172 58 L 88 58 Q 74 56 80 63 Z" fill="#2D232E" id="path5" />
    <rect x="108" y="41" width="44" height="15" rx="7.5" fill="#FFD166" stroke="#2D232E" stroke-width="2.5" id="rect5" />
    <text x="130" y="51.5" text-anchor="middle" font-size="12px" font-weight="700" fill="#2D232E" id="text5">LUXY</text>
  </g>
  <!-- Cheeks -->
  <ellipse cx="82" cy="128" rx="12" ry="7" fill="#FF7EB6" opacity="0.65" id="ellipse5" />
  <ellipse cx="178" cy="128" rx="12" ry="7" fill="#FF7EB6" opacity="0.65" id="ellipse6" />

  <!-- ========================================== -->
  <!-- DYNAMIC FACIAL EXPRESSIONS                 -->
  <!-- ========================================== -->

  <!-- 1. DEFAULT (Friendly - Identical to original) -->
  <g id="luxy-face-default">
    <g transform="translate(98, 112)" id="g8-default">
      <circle cx="0" cy="0" r="13.5" fill="#2D232E" id="circle6-default" />
      <circle cx="-4.5" cy="-4.5" r="4.8" fill="#FFFFFF" id="circle7-default" />
      <circle cx="4.5" cy="4.5" r="2.2" fill="#FFFFFF" id="circle8-default" />
    </g>
    <g transform="translate(162, 112)" id="g11-default">
      <circle cx="0" cy="0" r="13.5" fill="#2D232E" id="circle9-default" />
      <circle cx="-4.5" cy="-4.5" r="4.8" fill="#FFFFFF" id="circle10-default" />
      <circle cx="4.5" cy="4.5" r="2.2" fill="#FFFFFF" id="circle11-default" />
    </g>
    <path d="M 118 124 Q 124 132 130 124 Q 136 132 142 124" fill="none" stroke="#2D232E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" id="path12-default" />
  </g>

  <!-- 2. CODE (Focused Developer - Features thick glasses & glowing code highlights) -->
  <g id="luxy-face-code" style="display:none;">
    <!-- Developer Glasses -->
    <rect x="76" y="94" width="42" height="36" rx="6" fill="rgba(56, 189, 248, 0.15)" stroke="#2D232E" stroke-width="4" />
    <rect x="142" y="94" width="42" height="36" rx="6" fill="rgba(56, 189, 248, 0.15)" stroke="#2D232E" stroke-width="4" />
    <!-- Glasses bridge & arms -->
    <path d="M 118 112 Q 130 108 142 112" fill="none" stroke="#2D232E" stroke-width="4" stroke-linecap="round" />
    <line x1="68" y1="108" x2="76" y2="108" stroke="#2D232E" stroke-width="4" stroke-linecap="round" />
    <line x1="184" y1="108" x2="192" y2="108" stroke="#2D232E" stroke-width="4" stroke-linecap="round" />
    <!-- Focused eyes with green terminal-like square highlights -->
    <g transform="translate(98, 112)">
      <circle cx="0" cy="0" r="13.5" fill="#2D232E" />
      <rect x="-6" y="-6" width="6" height="6" rx="1" fill="#34D399" />
    </g>
    <g transform="translate(162, 112)">
      <circle cx="0" cy="0" r="13.5" fill="#2D232E" />
      <rect x="-6" y="-6" width="6" height="6" rx="1" fill="#34D399" />
    </g>
    <!-- Concentrated straight mouth -->
    <line x1="122" y1="130" x2="138" y2="130" stroke="#2D232E" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- 3. SPEC (Analytical - Features a sci-fi monocle and raised scanning eyebrow) -->
  <g id="luxy-face-spec" style="display:none;">
    <!-- Observant narrowed left eye -->
    <g transform="translate(98, 112)">
      <path d="M -13 2 A 13.5 13.5 0 0 0 13 2 Z" fill="#2D232E" />
      <circle cx="-3" cy="-2" r="3" fill="#FFFFFF" />
    </g>
    <!-- High-tech Scanning Monocle on right eye -->
    <g transform="translate(162, 112)">
      <!-- Monocle glass and rim -->
      <circle cx="0" cy="0" r="20" fill="rgba(224, 242, 254, 0.6)" stroke="#2D232E" stroke-width="3" />
      <!-- Inner pupil -->
      <circle cx="0" cy="0" r="13.5" fill="#2D232E" />
      <!-- Cyan targeting reticle -->
      <circle cx="0" cy="0" r="6" fill="none" stroke="#38BDF8" stroke-width="2.5" />
      <line x1="-14" y1="0" x2="14" y2="0" stroke="#38BDF8" stroke-width="2" />
      <line x1="0" y1="-14" x2="0" y2="14" stroke="#38BDF8" stroke-width="2" />
    </g>
    <!-- Analytical eyebrows (one angled down, one highly raised over monocle) -->
    <path d="M 86 102 L 108 96" fill="none" stroke="#2D232E" stroke-width="4" stroke-linecap="round" />
    <path d="M 148 86 Q 162 76 176 86" fill="none" stroke="#2D232E" stroke-width="4" stroke-linecap="round" />
    <!-- Thoughtful asymmetrical smirk -->
    <path d="M 120 128 L 132 128 L 138 124" fill="none" stroke="#2D232E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- 4. FALLBACK (Confused/Error - Features wincing eyes, zig-zag mouth & an anime sweat drop) -->
  <g id="luxy-face-fallback" style="display:none;">
    <!-- Classic wincing (> <) error eyes -->
    <g transform="translate(98, 112)">
      <path d="M -9 -9 L 7 0 L -9 9" fill="none" stroke="#2D232E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <g transform="translate(162, 112)">
      <path d="M 9 -9 L -7 0 L 9 9" fill="none" stroke="#2D232E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <!-- Zig-zag uncertain mouth -->
    <path d="M 116 128 L 122 123 L 128 128 L 134 123 L 140 128" fill="none" stroke="#2D232E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Anime-style anxiety sweat drop on the temple -->
    <path d="M 178 78 C 178 78, 188 88, 188 95 C 188 100, 183 105, 178 105 C 173 105, 168 100, 168 95 C 168 88, 178 78, 178 78 Z" fill="#38BDF8" stroke="#2D232E" stroke-width="3" stroke-linejoin="round" />
  </g>

  <!-- ========================================== -->
  <!-- END OF DYNAMIC FACIAL EXPRESSIONS          -->
  <!-- ========================================== -->

  <!-- Magnifying Glass -->
  <g id="g13">
    <!-- Handle Outline (drawn beneath inner handle for a stroke effect) -->
    <line x1="140" y1="160" x2="162" y2="167" stroke="#2D232E" stroke-width="11" stroke-linecap="round" id="line12" />
    <!-- Handle Inner -->
    <line x1="140" y1="160" x2="162" y2="167" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" id="line13" />
    <!-- Lens -->
    <circle cx="126" cy="152" r="17" fill="#E0F2FE" stroke="#2D232E" stroke-width="4" id="circle13" />
    <!-- Lens highlight -->
    <path d="M 115 143 A 10 10 0 0 1 123 138" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" id="path13" />
  </g>
  <!-- Hands -->
  <circle cx="94" cy="162" r="11" fill="#FFFDF9" stroke="#2D232E" stroke-width="4" id="circle14" />
  <circle cx="166" cy="162" r="11" fill="#FFFDF9" stroke="#2D232E" stroke-width="4" id="circle15" />
</g>

  
    
