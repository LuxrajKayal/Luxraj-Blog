  <!--
    DEMO SEARCH UI: floating launcher and search modal markup.
    The reusable engine should connect to Luxraj's existing search interface;
    retain only the UI adapter behavior that Luxraj actually needs.
    Inline event attributes below depend on globally reachable classic-script
    functions and must be addressed when modules are connected.
  -->
  <!-- FLOATING LAUNCHER (LUXY MASCOT) -->
  <button class="floating-search-fab" onclick="openSearchModal()">
    <span id="fab-mascot-holder" style="display:flex; align-items:center;"></span>
    <span>Ask Luxy</span>
    <span class="fab-badge" id="fab-chunk-count">0</span>
  </button>

  <!-- ==========================================================================
       LUXY CONVERSATIONAL MULTI-PAGE MODAL
       ========================================================================== -->
  <div class="modal-backdrop" id="search-modal-backdrop" onclick="if(event.target.id==='search-modal-backdrop') closeSearchModal()">
    <div class="search-modal-container">

      <div class="modal-header">
        <div class="modal-title-group">
          <div class="mascot-frame" id="modal-mascot-avatar" style="width: 42px; height: 42px;"></div>
          <div>
            <div style="display: flex; align-items: center; gap: 0.5rem;">
              <span style="font-weight: var(--font-weight-bold); font-size: var(--font-size-base);">Ask me anything about this website</span>
              <span class="luxy-status-pill" id="luxy-mood-label">STATE: READY</span>
            </div>
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 0.45rem;">
          <button class="btn" style="padding: 0.3rem 0.6rem; font-size: var(--font-size-xs);" onclick="clearChatHistory()">Clear Chat</button>
          <button class="btn" style="padding: 0.3rem 0.65rem;" onclick="closeSearchModal()">✕</button>
        </div>
      </div>

      <!-- Scope & Operator Helper Bar -->
      <div class="modal-Subbar">
        <div class="scope-selector">
          <span>PAGE SCOPE:</span>
          <select id="search-page-scope" class="form-select" style="width: auto; padding: 2px 6px; font-size: var(--font-size-xs);" onchange="handleInputAutocomplete()">
            <option value="ALL">All Crawled Pages (Global Site)</option>
            <option value="index.html">index.html only</option>
            <option value="/docs/risc-v-vector.html">/docs/risc-v-vector.html</option>
            <option value="/docs/fpga-timing.html">/docs/fpga-timing.html</option>
            <option value="/docs/can-fd-bus.html">/docs/can-fd-bus.html</option>
            <option value="/docs/usb-pd-controller.html">/docs/usb-pd-controller.html</option>
          </select>
        </div>
        <div style="color: var(--color-text-muted);">
          Prefix & Operators: <code>microcontrol</code> | <code>"exact phrase"</code> | <code>tag:fpga</code> | <code>has:table</code> | <code>has:code</code>
        </div>
      </div>

      <!-- Chat Feed -->
      <div class="chat-messages-container" id="chat-messages"></div>

      <!-- Modal Footer with Live Autocomplete Bar -->
      <div class="modal-footer">

        <!-- Live Static Autocomplete Panel -->
        <div class="autocomplete-panel" id="autocomplete-panel">
          <div class="autocomplete-row" id="ac-words-row"></div>
          <div class="autocomplete-row" id="ac-headings-row"></div>
        </div>

        <div class="quick-prompts">
          <span class="prompt-tag" onclick="runQuickPrompt('microcontrol')">🔍 Test Prefix: "microcontrol"</span>
          <span class="prompt-tag" onclick="runQuickPrompt('What is ESP32 deep sleep current draw?')">⚡ ESP32 sleep current</span>
          <span class="prompt-tag" onclick="runQuickPrompt('How do RISC-V vector registers handle strip-mining?')">🧮 RISC-V strip-mining</span>
          <span class="prompt-tag" onclick="runQuickPrompt('FPGA setup and hold time violation fixes has:table')">⏱️ FPGA timing table</span>
          <span class="prompt-tag" onclick="runQuickPrompt('CAN-FD arbitration vs data phase bit rate')">🚗 CAN-FD bit rates</span>
          <span class="prompt-tag" onclick="runQuickPrompt('USB-PD 240W Extended Power Range EPR negotiation')">🔌 USB-PD 240W EPR</span>
        </div>

        <div class="search-input-wrapper">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="color: var(--brand-crimson);"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input
            type="text"
            id="chat-input"
            class="modal-search-input"
            autocomplete="off"
            placeholder="Type partial words like 'microcontrol' (Press Tab to complete, Enter to ask)..."
            oninput="handleInputAutocomplete()"
            onkeydown="handleChatInputKeydown(event)"
          >
          <button class="btn btn-primary" onclick="sendSearchQuery()">Ask Luxy</button>
        </div>
      </div>

    </div>
  </div>
