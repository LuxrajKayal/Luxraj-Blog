name: Validate Luxy refinement

on:
  push:
    branches:
      - feature/luxy-personality-refinement
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: luxy-refinement-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          check-latest: true
      - name: Install pinned NLP training dependencies
        run: npm ci --prefix search-dependencies/nlp --ignore-scripts --no-fund --no-audit
      - name: Build and test public site without publishing
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-site.mjs
          node scripts/build-pagefind.mjs
          node scripts/test-pagefind.mjs
          node scripts/nlp/verify-upstream.mjs
          node scripts/build-nlp.mjs
          node scripts/test-nlp.mjs
          node scripts/build-rivescript.mjs
          node scripts/test-rivescript.mjs
