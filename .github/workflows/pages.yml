name: Deploy Luxraj Blog to GitHub Pages

on:
  push:
    branches:
      - main
      - feature/luxy-rebuild
    paths:
      - "site/**"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write # Built-in GITHUB_TOKEN persists injected source metadata.
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          check-latest: true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Build public site
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-site.mjs

          echo "Prepared public site:"
          find _site -maxdepth 2 -type f | sort | head -80

      - name: Persist injected SEO eligibility markers to source HTML
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" != refs/heads/* ]]; then
            echo "Skipping source metadata commit because this run is not on a branch ref: ${GITHUB_REF}"
            exit 0
          fi

          git add -- site

          if git diff --cached --quiet; then
            echo "No SEO eligibility source changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: persist SEO eligibility markers in source HTML"
          git push origin "HEAD:${GITHUB_REF}"

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
